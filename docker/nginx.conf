# Cache policy is resolved with a map rather than per-location add_header
# directives: nginx only inherits server-level add_header while a location
# declares none of its own, so any location that set its own Cache-Control
# would silently drop every security header. An empty map value means
# add_header emits nothing for that response.
map $uri $app_cache_control {
  default                             "";
  ~^/assets/                          "public, max-age=31536000, immutable";
  ~^/(index\.html|sw\.js|manifest\.json|robots\.txt)$ "no-cache, no-store, must-revalidate";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Keep parity with vercel.json so the container build is never the
  # least-protected deployment surface. Declared once at server level and
  # inherited by every location, because no location below adds its own header.
  add_header Cache-Control $app_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.payangels.co https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.payangels.com https://images.unsplash.com; frame-src https://js.payangels.co https://checkout.payangels.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # HSTS is only meaningful once this container terminates TLS or sits behind a
  # TLS-terminating proxy; it is harmless over plain HTTP on :80.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Never serve dotfiles or the SPA's source maps to the public.
  location ~ /\. {
    deny all;
  }

  location ~* \.map$ {
    deny all;
  }
}
