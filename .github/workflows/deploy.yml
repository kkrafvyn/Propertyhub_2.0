name: Deploy

on:
  workflow_dispatch:
    inputs:
      skip_db:
        description: Skip Supabase DB push
        type: boolean
        default: false

jobs:
  production-gate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production readiness gate
        run: npm run production:check:repo

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Upgrade SQL regressions
        run: npm run test:sql:upgrades

      - name: Backup restore fixture
        run: npm run backup:restore-drill:fixture

  supabase-deploy:
    needs: production-gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Supabase backend
        run: |
          if [ "${{ inputs.skip_db }}" = "true" ]; then
            npm run supabase:deploy:payments -- --skip-db
          else
            npm run supabase:deploy:payments -- --with-db
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
