name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production readiness gate
        run: npm run production:check

      - name: Tenant isolation fixture status
        run: npm run security:tenant-fixtures

      - name: Tenant isolation integration tests
        run: npm run test -- src/lib/security/tenant-isolation.test.ts
        env:
          VITE_SUPABASE_TEST_URL: ${{ secrets.VITE_SUPABASE_TEST_URL }}
          VITE_SUPABASE_TEST_ANON_KEY: ${{ secrets.VITE_SUPABASE_TEST_ANON_KEY }}
          VITE_SUPABASE_TEST_TENANT_A_TOKEN: ${{ secrets.VITE_SUPABASE_TEST_TENANT_A_TOKEN }}
          VITE_SUPABASE_TEST_TENANT_B_TOKEN: ${{ secrets.VITE_SUPABASE_TEST_TENANT_B_TOKEN }}
          VITE_SUPABASE_TEST_TENANT_A_ID: ${{ secrets.VITE_SUPABASE_TEST_TENANT_A_ID }}
          VITE_SUPABASE_TEST_TENANT_B_ID: ${{ secrets.VITE_SUPABASE_TEST_TENANT_B_ID }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
