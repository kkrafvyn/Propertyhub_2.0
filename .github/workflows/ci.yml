name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Upgrade policy tests
        run: npx vitest run scripts/backup/backup-evidence.test.mjs scripts/pilot/payment-certification.test.mjs

      - name: Upgrade SQL regressions
        run: npm run test:sql:upgrades

      - name: Production readiness gate
        run: npm run production:check:repo

      - name: Legal catalog tests
        run: npm run test -- src/content/legal/legal-catalog.test.ts

      - name: Backup restore drill (fixture)
        run: npm run backup:restore-drill:fixture

      - name: Tenant isolation fixture status
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run security:tenant-fixtures
        env:
          CI: true
          VITE_SUPABASE_TEST_URL: ${{ secrets.VITE_SUPABASE_TEST_URL }}
          VITE_SUPABASE_TEST_ANON_KEY: ${{ secrets.VITE_SUPABASE_TEST_ANON_KEY }}
          VITE_SUPABASE_TEST_TENANT_A_ID: ${{ secrets.VITE_SUPABASE_TEST_TENANT_A_ID }}
          VITE_SUPABASE_TEST_TENANT_B_ID: ${{ secrets.VITE_SUPABASE_TEST_TENANT_B_ID }}

      - name: Tenant isolation integration tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run test -- src/lib/security/tenant-isolation.test.ts src/lib/security/storage-isolation.test.ts src/lib/security/platform-admin-live.test.ts
        env:
          RUN_TENANT_ISOLATION_TESTS: true
          VITE_SUPABASE_TEST_URL: ${{ secrets.VITE_SUPABASE_TEST_URL }}
          VITE_SUPABASE_TEST_ANON_KEY: ${{ secrets.VITE_SUPABASE_TEST_ANON_KEY }}
          VITE_SUPABASE_TEST_TENANT_A_ID: ${{ secrets.VITE_SUPABASE_TEST_TENANT_A_ID }}
          VITE_SUPABASE_TEST_TENANT_B_ID: ${{ secrets.VITE_SUPABASE_TEST_TENANT_B_ID }}
          TENANT_FIXTURE_PASSWORD: ${{ secrets.TENANT_FIXTURE_PASSWORD }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
