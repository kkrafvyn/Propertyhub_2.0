name: Offsite Backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Backup tier (auto, daily, weekly, monthly, pre-migration)"
        required: false
        default: "auto"

jobs:
  offsite-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offsite backup pipeline
        run: |
          node scripts/backup/check-evidence.mjs --preflight

          TIER="$REQUESTED_TIER"
          if [ "$TIER" = "auto" ] || [ -z "$TIER" ]; then
            node scripts/backup/run-offsite-backup.mjs -- --auto-tier --verify-db
          else
            node scripts/backup/run-offsite-backup.mjs -- --tier "$TIER" --verify-db
          fi
        env:
          REQUESTED_TIER: ${{ inputs.tier }}
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BACKUP_KMS_KEY_ID: ${{ secrets.BACKUP_KMS_KEY_ID }}

      - name: Upload restore drill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-drill-evidence
          path: |
            backups/latest-run.json
            scripts/backup/RESTORE_DRILL_EVIDENCE.json
          if-no-files-found: error

      - name: Require fresh full offsite backup evidence
        if: success()
        run: node scripts/backup/check-evidence.mjs --integrity-only

      - name: Record backup result for monitoring
        if: always()
        run: node scripts/backup/record-result.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
