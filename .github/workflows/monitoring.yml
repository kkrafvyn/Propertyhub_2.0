name: Monitoring

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Operational health check
        run: npm run ops:health
        env:
          NODE_OPTIONS: --import ./scripts/lib/ensure-node-websocket.mjs
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          HEALTH_CHECK_REQUIRE_ALERTS: ${{ secrets.OPS_ALERT_WEBHOOK_URL != '' && 'true' || 'false' }}
          HEALTH_CHECK_OPTIONAL_APP_PROBE: ${{ vars.APP_HEALTH_URL == '' && 'true' || 'false' }}
          HEALTH_CHECK_SKIP_IF_UNCONFIGURED: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY == '' && 'true' || 'false' }}
