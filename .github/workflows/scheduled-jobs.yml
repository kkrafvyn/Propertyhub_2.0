name: Scheduled Jobs

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Operational health check
        run: npm run ops:health
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run background workers
        run: npm run jobs:run-all
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INTERNAL_AUTOMATIONS_KEY: ${{ secrets.INTERNAL_AUTOMATIONS_KEY }}
