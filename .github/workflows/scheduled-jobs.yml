name: Scheduled Jobs

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Operational health check
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Skipping health check — Supabase secrets not configured."
            exit 0
          fi
          npm run ops:health
        env:
          NODE_OPTIONS: --import ./scripts/lib/ensure-node-websocket.mjs
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run background workers
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_DB_URL" ]; then
            echo "Skipping background workers — Supabase secrets not fully configured."
            exit 0
          fi
          npm run jobs:run-all
        env:
          NODE_OPTIONS: --import ./scripts/lib/ensure-node-websocket.mjs
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          INTERNAL_AUTOMATIONS_KEY: ${{ secrets.INTERNAL_AUTOMATIONS_KEY }}
