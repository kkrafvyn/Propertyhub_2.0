name: Scheduled Jobs

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Operational health check
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Scheduled health check cannot run: Supabase secrets are not configured."
            exit 1
          fi
          npm run ops:health
        env:
          NODE_OPTIONS: --import ./scripts/lib/ensure-node-websocket.mjs
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run background workers
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_DB_URL" ]; then
            echo "Scheduled workers cannot run: Supabase secrets are not fully configured."
            exit 1
          fi
          npm run jobs:run-all
        env:
          NODE_OPTIONS: --import ./scripts/lib/ensure-node-websocket.mjs
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          INTERNAL_AUTOMATIONS_KEY: ${{ secrets.INTERNAL_AUTOMATIONS_KEY }}
