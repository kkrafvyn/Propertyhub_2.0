name: BaytMiftah Visual Screenshots

on:
  pull_request:
    paths:
      - "src/**"
      - "visual-tour-preview.html"
      - "scripts/capture-actual-ui.mjs"
      - ".github/workflows/visual-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture actual branch UI
        run: node scripts/capture-actual-ui.mjs
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Upload real screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baytmiftah-actual-ui-screenshots
          path: visual-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
