name: Security DAST

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dast:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check DAST target configured
        id: dast_config
        env:
          DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL || secrets.DAST_TARGET_URL }}
        run: |
          if [ -z "$DAST_TARGET_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DAST_TARGET_URL is not configured; recording UNVERIFIED."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record DAST as unverified when target is missing
        if: steps.dast_config.outputs.configured != 'true'
        run: |
          node scripts/security/record-job-result.mjs dast UNVERIFIED '{"reason":"Set DAST_TARGET_URL in repository variables or staging secrets"}'
          node scripts/security/record-job-result.mjs dast-authenticated UNVERIFIED '{"reason":"Set DAST_TEST_EMAIL and DAST_TEST_PASSWORD when DAST is enabled"}'

      - name: Upload DAST unverified artifact
        if: steps.dast_config.outputs.configured != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-dast
          path: security-results/
          retention-days: 1

      - name: Validate DAST target safety
        if: steps.dast_config.outputs.configured == 'true'
        run: node scripts/security/validate-dast-target.mjs
        env:
          DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL || secrets.DAST_TARGET_URL }}
          DAST_ALLOW_NON_STAGING: ${{ vars.DAST_ALLOW_NON_STAGING || secrets.DAST_ALLOW_NON_STAGING }}

      - name: OWASP ZAP baseline scan (anonymous)
        if: steps.dast_config.outputs.configured == 'true'
        id: zap_anonymous
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ vars.DAST_TARGET_URL || secrets.DAST_TARGET_URL }}
          cmd_options: "-a -j"
          allow_issue_writing: false
          artifact_name: zap-anonymous

      - name: Verify anonymous DAST report
        if: steps.dast_config.outputs.configured == 'true'
        run: test -s report_json.json

      - name: Prepare authenticated DAST session
        id: dast_auth
        if: steps.dast_config.outputs.configured == 'true'
        run: node scripts/security/prepare-dast-auth.mjs
        env:
          DAST_TEST_EMAIL: ${{ secrets.DAST_TEST_EMAIL }}
          DAST_TEST_PASSWORD: ${{ secrets.DAST_TEST_PASSWORD }}
          DAST_SUPABASE_URL: ${{ secrets.DAST_SUPABASE_URL || secrets.VITE_SUPABASE_TEST_URL }}
          DAST_SUPABASE_ANON_KEY: ${{ secrets.DAST_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_TEST_ANON_KEY }}

      - name: Mask DAST bearer token
        if: steps.dast_config.outputs.configured == 'true' && steps.dast_auth.outputs.available == 'true'
        run: echo "::add-mask::${{ steps.dast_auth.outputs.token }}"

      - name: Clear previous DAST report
        if: steps.dast_config.outputs.configured == 'true' && steps.dast_auth.outputs.available == 'true'
        run: rm -f report_json.json

      - name: OWASP ZAP baseline scan (authenticated)
        if: steps.dast_config.outputs.configured == 'true' && steps.dast_auth.outputs.available == 'true'
        id: zap_authenticated
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ vars.DAST_TARGET_URL || secrets.DAST_TARGET_URL }}
          cmd_options: "-a -j -z \"${{ steps.dast_auth.outputs.zap_options }}\""
          allow_issue_writing: false
          artifact_name: zap-authenticated

      - name: Verify authenticated DAST report
        if: steps.dast_config.outputs.configured == 'true' && steps.dast_auth.outputs.available == 'true'
        run: test -s report_json.json

      - name: Record DAST results
        if: always() && steps.dast_config.outputs.configured == 'true'
        run: |
          node scripts/security/record-job-result.mjs dast "${{ job.status == 'success' && 'PASS' || 'FAIL' }}" '{"tool":"owasp-zap-baseline","mode":"anonymous+authenticated"}'
          if [ "${{ steps.dast_auth.outputs.available }}" = "true" ]; then
            node scripts/security/record-job-result.mjs dast-authenticated PASS '{"tool":"owasp-zap-baseline","mode":"authenticated"}'
          else
            node scripts/security/record-job-result.mjs dast-authenticated UNVERIFIED '{"reason":"Set DAST_TEST_EMAIL and DAST_TEST_PASSWORD in staging environment"}'
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.dast_config.outputs.configured == 'true' && (failure() || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        with:
          name: security-dast
          path: |
            report_html.html
            report_json.json
            security-results/dast.json
            security-results/dast-authenticated.json
          retention-days: 1

  dast-unverified:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Record DAST as unverified on pull requests
        run: |
          node scripts/security/record-job-result.mjs dast UNVERIFIED '{"reason":"DAST runs on main push, schedule, and manual dispatch against staging only"}'
          node scripts/security/record-job-result.mjs dast-authenticated UNVERIFIED '{"reason":"Authenticated DAST runs on main push, schedule, and manual dispatch"}'

