name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "electron/**"
      - "src/**"
      - "package.json"
      - "vite.config.ts"

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop installer
        run: npm run desktop:pack:win

      - name: Publish installer artifact
        run: npm run desktop:publish

      - uses: actions/upload-artifact@v4
        with:
          name: baytmiftah-desktop-setup
          path: |
            dist-desktop/baytmiftah-desktop-setup.exe
            public/downloads/baytmiftah-desktop-setup.exe
