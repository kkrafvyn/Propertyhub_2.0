name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build and verify a signed release
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - "electron/**"
      - "src/**"
      - "package.json"
      - "vite.config.ts"

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows test installer
        if: ${{ !inputs.signed_release }}
        run: npm run desktop:pack:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build signed Windows release
        if: ${{ inputs.signed_release }}
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw "Configure the signing certificate and password for a signed release" }
          npm run desktop:pack:win:signed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = @('dist-desktop/win-unpacked/BaytMiftah Workspace.exe','dist-desktop/baytmiftah-desktop-setup.exe')
          foreach ($target in $targets) {
            if ((Get-AuthenticodeSignature -LiteralPath $target).Status -ne 'Valid') { throw "Invalid release signature: $target" }
          }
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Publish signed installer artifact
        if: ${{ inputs.signed_release }}
        run: npm run desktop:publish

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baytmiftah-desktop-setup
          path: |
            dist-desktop/baytmiftah-desktop-setup.exe
            public/downloads/baytmiftah-desktop-setup.exe
