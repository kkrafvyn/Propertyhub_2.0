
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="theme-color" content="#0F2922" />
      <meta name="application-name" content="BaytMiftah" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="BaytMiftah" />
      <meta
        name="description"
        content="BaytMiftah — discover, rent, buy, lease, and host properties across Ghana with verified agencies and secure payments."
      />
      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
      <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
      <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
      <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
      <title>BaytMiftah</title>
      <style>
        html,
        body {
          min-height: 100%;
          margin: 0;
        }
        body {
          overflow-y: auto;
          overflow-x: clip;
        }
        #root {
          min-height: 100%;
        }
      </style>
      <script>
        (function() {
          try {
            var theme = localStorage.getItem('baytmiftah_theme') || 'system';
            var accent = localStorage.getItem('baytmiftah_accent') || 'emerald';
            var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var root = document.documentElement;
            if (isDark) {
              root.classList.add('dark');
              root.setAttribute('data-theme', 'dark');
            } else {
              root.classList.remove('dark');
              root.setAttribute('data-theme', 'light');
            }
            root.setAttribute('data-theme-mode', theme);
            root.setAttribute('data-accent', accent);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
              meta.setAttribute('content', isDark ? '#081713' : '#fcfbf9');
            }
          } catch (e) {}
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
