<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BaytMiftah" />
    <meta
      name="description"
      content="BaytMiftah — unlocking property opportunities across Ghana."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>BaytMiftah</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('baytmiftah_theme') || 'light'
          var isDark = theme === 'dark'
          var root = document.documentElement
          root.classList.toggle('dark', isDark)
          root.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', isDark ? '#0F2922' : '#FFFFFF')
          var apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          if (apple) apple.setAttribute('content', isDark ? 'black-translucent' : 'default')
        } catch (e) {}
      })()
    </script>
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: var(--splash-bg, #ffffff);
        color: var(--splash-fg, #0f2922);
        transition: opacity 320ms ease;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #pwa-splash.pwa-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      #pwa-splash img {
        width: 96px;
        height: 96px;
        border-radius: 22%;
      }
      #pwa-splash span {
        font-family: Inter, system-ui, sans-serif;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      #pwa-splash small {
        font-family: Inter, system-ui, sans-serif;
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        opacity: 0.72;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="pwa-splash" aria-hidden="true">
      <img src="/icons/icon-192.webp" width="96" height="96" alt="" />
      <span>BΛYTMIFTΛH</span>
      <small>Unlocking property opportunities</small>
    </div>
    <script>
      (function () {
        try {
          if ((localStorage.getItem('baytmiftah_theme') || 'light') === 'dark') {
            document.documentElement.style.setProperty('--splash-bg', '#0f2922')
            document.documentElement.style.setProperty('--splash-fg', '#ffffff')
          }
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
