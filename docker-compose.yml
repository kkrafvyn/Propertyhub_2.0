services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: baytmiftah/web:local
    ports:
      - "8080:80"
    profiles:
      - staging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional local security tool runner (same versions as install-security-tools.mjs)
  gitleaks:
    image: zricethezav/gitleaks:v8.24.2
    volumes:
      - ./:/repo:ro
    working_dir: /repo
    command: detect --source /repo --config /repo/.gitleaks.toml --redact
    profiles:
      - security

  trivy:
    image: aquasec/trivy:0.74.0
    volumes:
      - ./:/repo:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /repo
    profiles:
      - security
