/**
 * Release signing for CI and local Play uploads.
 * Set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
 */
def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
def keystoreStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def keystoreKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def keystoreKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

def signingReady = keystoreFilePath != null && keystoreStorePassword != null && keystoreKeyAlias != null &&
        keystoreKeyPassword != null && new File(keystoreFilePath).exists()

if (signingReady) {
    android {
        signingConfigs {
            release {
                storeFile file(keystoreFilePath)
                storePassword keystoreStorePassword
                keyAlias keystoreKeyAlias
                keyPassword keystoreKeyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
} else if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
    logger.lifecycle(
        "Release signing env not set (ANDROID_KEYSTORE_*). " +
        "Configure secrets for Play upload or set env vars locally."
    )
}
